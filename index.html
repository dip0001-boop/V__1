<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verdant-1.0</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">V</div><div><b>Verdant-1.0</b><span>learned intelligence</span></div></div><button id="new">＋ New chat</button><div class="panel"><h3>Training</h3><input id="goal" placeholder="Goal — e.g. Learn C++"><label>Minutes <input id="mins" type="number" min="1" max="120" value="20"></label><button id="train">Train Verdant</button><button id="stop" class="ghost">Stop</button><div id="status">Idle</div></div><div class="modelinfo">Model steps <b id="steps">0</b><br>Learned values <b id="params">—</b></div></aside><main><header><div><b>Verdant-1.0</b><small>Backend learned core</small></div><span id="conn">● connected</span></header><div id="chat"></div><div class="composer"><div class="effort"><button data-e="lite">Lite</button><button data-e="medium" class="active">Medium</button><button data-e="max">MAX</button></div><div class="box"><textarea id="input" rows="1" placeholder="Message Verdant..."></textarea><button id="send">↑</button></div><small>Training and inference run on the backend.</small></div></main></div><script src="/app.js"></script></body></html>
