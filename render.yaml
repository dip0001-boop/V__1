services:
  - type: web
    name: verdant-1-0
    runtime: python

    buildCommand: >
      pip install -r requirements.txt &&
      pip install torch==2.14.0
      --index-url https://download.pytorch.org/whl/cpu

    startCommand: >
      uvicorn server:app
      --host 0.0.0.0
      --port $PORT
